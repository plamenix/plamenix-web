[package]
name = "plamenix-fbclient-node"
version = "1.0.0-beta.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Zlatan Omerović <zlomerovic@hotmail.com>"]
description = "NAPI bindings to rsfbclient for Node.js — Plamenix web edition driver."
publish = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
plamenix-types = { path = "../../../plamenix-core/crates/plamenix-types" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
