[package]
name = "plamenix-native"
version = "1.0.0-beta.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Zlatan Omerović <zlomerovic@hotmail.com>"]
description = "NAPI bindings to rsfbclient for Node.js — Plamenix web edition driver."
publish = false

[lib]
# `cdylib` only. An `rlib` would let integration tests link the crate,
# but the napi symbols (`napi_add_env_cleanup_hook` and friends) are
# supplied by the Node process at runtime and a plain test binary has no
# Node to supply them. Tests that need the real module are unit tests
# inside `src/`, where the cdylib's undefined-symbol handling applies.
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
plamenix-types = { path = "../../../plamenix-core/crates/plamenix-types" }
plamenix-db = { path = "../../../plamenix-core/crates/plamenix-db", default-features = false, features = ["pure-rust", "native"] }
plamenix-tracing = { path = "../../../plamenix-core/crates/plamenix-tracing", features = ["otlp"] }
plamenix-plugin-host = { path = "../../../plamenix-core/crates/plamenix-plugin-host" }
plamenix-secrets = { path = "../../../plamenix-core/crates/plamenix-secrets" }
semver = "1"
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
# `deny` instead of `forbid` because the `#[napi]` proc macro expands to
# code that must `#[allow(unsafe_code)]` for the FFI surface. Outside the
# napi-generated blocks, this crate stays unsafe-free.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# napi-rs's `#[napi]` proc macro expands to types with trailing empty
# arrays; this is internal to the macro and not something we can fix.
trailing_empty_array = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# Same vendored rsfbclient-native patch used by the desktop edition.
# Mirrors `plamenix-core/Cargo.toml` so the web edition decodes ARRAY
# columns instead of erroring on type 540.
rsfbclient-native = { path = "../../../plamenix-core/vendor/rsfbclient-native" }
