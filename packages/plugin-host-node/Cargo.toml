[package]
name = "plamenix-plugin-host-node"
version = "1.0.0-beta.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Zlatan Omerović <zlomerovic@hotmail.com>"]
description = "NAPI bindings to plamenix-plugin-host — Plamenix web edition plugin runtime."
publish = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
plamenix-plugin-host = { path = "../../../plamenix-core/crates/plamenix-plugin-host" }
plamenix-tracing = { path = "../../../plamenix-core/crates/plamenix-tracing", features = ["otlp"] }
semver = "1"
tracing = "0.1"

[lints.rust]
# `deny` instead of `forbid` because the `#[napi]` proc macro expands to
# code that must `#[allow(unsafe_code)]` for the FFI surface. Outside the
# napi-generated blocks, this crate stays unsafe-free.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
trailing_empty_array = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
